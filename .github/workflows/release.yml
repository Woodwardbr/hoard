name: Release

# Push a tag like v0.2.0 (matching the version in pyproject.toml) to publish a
# GitHub Release with the wheel and the install scripts the one-liners download.

on:
  push:
    tags: ["v*"]

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Tag matches pyproject version
        run: |
          version=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME != pyproject version $version"; exit 1; }
      - run: uv build
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* install/install.sh install/install.ps1 \
            install/uninstall.sh install/uninstall.ps1 \
            --title "Hoard $GITHUB_REF_NAME" --generate-notes
